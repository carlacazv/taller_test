name: import-preserved-history

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'bootstrap/import-history'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bundle source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunks/chunk-*.b64 | base64 --decode > /tmp/repository.bundle
          git bundle verify /tmp/repository.bundle

      - name: Clone and verify preserved history
        shell: bash
        run: |
          set -euo pipefail
          git clone /tmp/repository.bundle /tmp/imported
          actual_sha="$(git -C /tmp/imported rev-parse HEAD)"
          expected_sha="5caf8fb08e2de5d46ebdf991f3c994d92586d035"
          echo "Preserved head: ${actual_sha}"
          test "${actual_sha}" = "${expected_sha}"

      - name: Import preserved main history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -C /tmp/imported remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C /tmp/imported push origin main:main --force

      - name: Remove bootstrap branch
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C /tmp/imported push origin --delete bootstrap/import-history
