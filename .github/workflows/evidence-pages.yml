name: Evidence Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidence-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build verified evidence site
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all test layers with Allure
        env:
          ALLURE_NODE_TEST_CONFIG: >-
            {"resultsDir":"allure-results","globalLabels":{"repository":"${{ github.repository }}","launch":"evidence-pages"},"environmentInfo":{"node":"24","runner":"ubuntu-latest","commit":"${{ github.sha }}"}}
        run: npm run test:allure

      - name: Generate consolidated Allure report
        run: npm run report:allure

      - name: Generate runtime and traceability comparison
        env:
          COMPARISON_ITERATIONS: "5"
          COMPARISON_WARMUPS: "1"
        run: npm run compare:layers

      - name: Regenerate automated mutation evidence
        run: npm run mutation:automated

      - name: Reproduce realistic mutant lattice
        run: npm run audit:manual

      - name: Assemble verified static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/evidence _site/allure
          cp -R site/. _site/
          cp reports/test-layer-comparison/comparison.json _site/evidence/runtime-comparison.json
          cp reports/test-layer-comparison/comparison.md _site/evidence/runtime-comparison.md
          cp reports/mutation/automated-mutation.json _site/evidence/automated-mutation.json
          cp reports/mutation/automated-mutation.md _site/evidence/automated-mutation.md
          cp reports/mutation/manual-mutant-panel.json _site/evidence/manual-mutant-panel.json
          cp reports/mutation/manual-mutant-panel.md _site/evidence/manual-mutant-panel.md
          cp reports/mutation/manual-mutant-panel.csv _site/evidence/manual-mutant-panel.csv
          cp -R allure-report/. _site/allure/
          cp docs/quote-pricing/dominant-configuration.md _site/evidence/dominant-configuration.md
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v6
        with:
          name: pages-evidence-${{ github.run_number }}
          path: |
            reports/test-layer-comparison
            reports/mutation
            allure-results
            allure-report
            playwright-report
            test-results/playwright
          if-no-files-found: warn
          retention-days: 30

      - name: Write evidence summary
        run: |
          {
            echo "## Evidence Pages build"
            echo ""
            echo "- Unit, integration, system E2E, and Playwright browser E2E passed before the site artifact was created."
            echo "- Browser E2E uses semantic locators plus Page Objects and retains trace/screenshot/video on failure."
            echo "- Runtime evidence was regenerated from this commit."
            echo "- Automated mutation and the realistic mutant lattice were regenerated from this commit."
            echo "- The consolidated Allure HTML report is embedded under \`/allure/\`."
            echo "- Mutation evidence remains a separate result model from Allure test results."
            echo "- Raw comparison, mutation, Playwright, and Allure evidence are retained as workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          status_code="$(curl \
            --silent \
            --show-error \
            --output /tmp/pages-response.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/pages")"

          case "$status_code" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages is not enabled. Enable Settings > Pages > Source: GitHub Actions to publish the verified site."
              ;;
            *)
              echo "::error::Unable to inspect GitHub Pages configuration (HTTP $status_code)."
              cat /tmp/pages-response.json
              exit 1
              ;;
          esac

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Deploy verified site
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Explain skipped deployment
        if: steps.pages.outputs.enabled != 'true'
        run: |
          {
            echo "## GitHub Pages deployment skipped"
            echo ""
            echo "The verified site artifact was built successfully, but GitHub Pages is not enabled for this repository."
            echo "Enable **Settings → Pages → Source: GitHub Actions**, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
