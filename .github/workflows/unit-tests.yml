name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare evidence directories
        run: |
          rm -rf allure-results allure-report
          mkdir -p reports

      - name: Run unit tests with Allure
        id: tests
        continue-on-error: true
        env:
          ALLURE_NODE_TEST_CONFIG: >-
            {"resultsDir":"allure-results","globalLabels":{"layer":"unit","repository":"${{ github.repository }}"},"environmentInfo":{"node":"24","runner":"ubuntu-latest"}}
        run: |
          set -o pipefail
          npm run test:unit:allure 2>&1 | tee reports/unit-tests.log

      - name: Generate Allure HTML report
        if: always()
        run: npm run report:allure

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence-${{ github.run_number }}
          path: |
            allure-results
            allure-report
            reports/unit-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write unit test summary
        if: always()
        run: |
          {
            echo "## Unit test evidence"
            echo ""
            echo "- Test command: \`npm run test:unit:allure\`"
            echo "- Raw log: \`reports/unit-tests.log\`"
            echo "- Allure results and HTML report are attached to this workflow run."
            echo "- Test outcome: \`${{ steps.tests.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve unit test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
