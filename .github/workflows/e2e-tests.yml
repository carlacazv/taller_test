name: System E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-e2e-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: System E2E / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare evidence directories
        run: |
          rm -rf allure-results allure-report
          mkdir -p reports

      - name: Run system E2E tests with Allure
        id: tests
        continue-on-error: true
        env:
          ALLURE_NODE_TEST_CONFIG: >-
            {"resultsDir":"allure-results","globalLabels":{"layer":"system-e2e","repository":"${{ github.repository }}"},"environmentInfo":{"node":"24","runner":"ubuntu-latest"}}
        run: |
          set -o pipefail
          npm run test:e2e:allure 2>&1 | tee reports/e2e-tests.log

      - name: Generate Allure HTML report
        if: always()
        run: npm run report:allure

      - name: Upload system E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: system-e2e-evidence-${{ github.run_number }}
          path: |
            allure-results
            allure-report
            reports/e2e-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write system E2E summary
        if: always()
        run: |
          {
            echo "## System E2E evidence"
            echo ""
            echo "- Test command: \`npm run test:e2e:allure\`"
            echo "- Raw log: \`reports/e2e-tests.log\`"
            echo "- Allure results and HTML report are attached to this workflow run."
            echo "- Test outcome: \`${{ steps.tests.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve system E2E failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
