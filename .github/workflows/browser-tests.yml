name: Browser E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Playwright Browser E2E / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare evidence directories
        run: |
          rm -rf allure-results allure-report playwright-report test-results
          mkdir -p reports

      - name: Run Playwright browser E2E with Allure
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:browser:allure 2>&1 | tee reports/browser-tests.log

      - name: Generate Allure HTML report
        if: always()
        run: npm run report:allure

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-evidence-${{ github.run_number }}
          path: |
            allure-results
            allure-report
            playwright-report
            test-results/playwright
            reports/browser-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write browser E2E summary
        if: always()
        run: |
          {
            echo "## Playwright browser E2E evidence"
            echo ""
            echo "- Browser: Playwright-managed Chromium"
            echo "- Test command: \`npm run test:browser:allure\`"
            echo "- Locator policy: accessible role/label first; CSS/XPath layout selectors are not used."
            echo "- Failure evidence: Playwright trace, screenshot, video, raw log, and Allure output."
            echo "- Test outcome: \`${{ steps.tests.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve browser E2E failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
